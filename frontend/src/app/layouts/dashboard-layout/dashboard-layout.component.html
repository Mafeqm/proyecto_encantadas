<div class="min-h-screen bg-pearl text-slate-700 font-sans selection:bg-teal-100 selection:text-teal-800 relative overflow-x-hidden">
  
  <!-- Halos decorativos ambientales para potenciar el Glassmorphism -->
  <div class="pointer-events-none fixed -top-28 -left-28 w-96 h-96 rounded-full bg-purple-300/15 blur-3xl"></div>
  <div class="pointer-events-none fixed top-1/3 -right-28 w-96 h-96 rounded-full bg-teal-300/10 blur-3xl"></div>

  <!-- Overlay oscuro suave para dispositivos móviles -->
  @if (uiState.isSidebarOpen()) {
    <div 
      (click)="uiState.closeMobileSidebar()"
      class="fixed inset-0 z-30 bg-slate-900/15 backdrop-blur-sm transition-opacity lg:hidden">
    </div>
  }

  <!-- Contenedor General del Layout -->
  <div class="relative z-10 flex min-h-screen p-4 sm:p-6 gap-6 max-w-[1600px] mx-auto">

    <!-- ==================== SIDEBAR FLOTANTE (GLASSMORPHISM) ==================== -->
    <aside 
      [class.translate-x-0]="uiState.isSidebarOpen()"
      [class.-translate-x-[120%]]="!uiState.isSidebarOpen()"
      class="fixed inset-y-4 left-4 z-40 w-72 lg:static lg:translate-x-0 flex flex-col justify-between
             bg-white/70 backdrop-blur-lg rounded-4xl shadow-soft border border-white/80
             p-6 transition-transform duration-300 ease-out">

      <!-- Logo & Marca -->
      <div>
        <div class="flex items-center justify-between px-2 mb-10">
          <div class="flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-500/15 to-teal-400/15 flex items-center justify-center shadow-inner">
              <lucide-icon 
                [img]="icons.Sparkles" 
                [strokeWidth]="iconStrokeWidth" 
                class="w-6 h-6 text-purple-500">
              </lucide-icon>
            </div>
            <div>
              <span class="block text-xl font-semibold tracking-tight text-slate-800">
                Encantadas
              </span>
              <span class="block text-xs font-medium tracking-wider uppercase text-purple-400">
                Beauty Studio
              </span>
            </div>
          </div>

          <!-- Botón cerrar en móvil -->
          <button 
            type="button"
            (click)="uiState.closeMobileSidebar()"
            class="lg:hidden p-2 rounded-2xl text-purple-400 hover:bg-purple-50/60 transition-colors">
            <lucide-icon [img]="icons.X" [strokeWidth]="iconStrokeWidth" class="w-5 h-5"></lucide-icon>
          </button>
        </div>

        <!-- Etiqueta estructural sutil -->
        <p class="px-4 mb-3 text-[11px] font-semibold uppercase tracking-widest text-purple-400/90">
          Menú Principal
        </p>

        <!-- Navegación -->
        <nav class="space-y-2">
          @for (item of navItems; track item.route) {
            <a
              [routerLink]="item.route"
              routerLinkActive="bg-teal-500/10 text-teal-600 font-semibold shadow-[inset_0_0_0_1px_rgba(20,184,166,0.15)]"
              #rla="routerLinkActive"
              (click)="onSelectNav(item)"
              class="group flex items-center gap-3.5 px-4 py-3.5 rounded-2xl text-sm font-medium text-slate-600
                     hover:bg-white/80 hover:text-slate-900 transition-all duration-200">
              
              <!-- Ícono con acento Turquesa cuando está activo, o Lila sutil en reposo -->
              <lucide-icon
                [img]="item.icon"
                [strokeWidth]="iconStrokeWidth"
                [class.text-teal-500]="rla.isActive"
                [class.text-purple-400]="!rla.isActive"
                class="w-5 h-5 transition-colors group-hover:text-teal-500">
              </lucide-icon>

              <span>{{ item.label }}</span>

              <!-- Indicador tipo píldora derecha en estado activo -->
              @if (rla.isActive) {
                <span class="ml-auto w-1.5 h-5 rounded-full bg-teal-400"></span>
              }
            </a>
          }
        </nav>
      </div>

      <!-- Footer del Sidebar: Tarjeta sutil de sesión -->
      <div class="pt-6 border-t border-purple-100/60">
        <div class="flex items-center justify-between p-3 rounded-3xl bg-white/60 shadow-soft">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-purple-100/80 text-purple-500 flex items-center justify-center font-semibold text-sm">
              AD
            </div>
            <div class="leading-tight">
              <p class="text-sm font-semibold text-slate-800">Administradora</p>
              <p class="text-xs text-purple-400">Recepción Principal</p>
            </div>
          </div>

          <button 
            type="button" 
            title="Cerrar sesión"
            class="p-2.5 rounded-2xl text-purple-400 hover:text-rose-500 hover:bg-rose-50/70 transition-colors">
            <lucide-icon [img]="icons.LogOut" [strokeWidth]="iconStrokeWidth" class="w-4 h-4"></lucide-icon>
          </button>
        </div>
      </div>
    </aside>

    <!-- ==================== COLUMNA PRINCIPAL (TOPBAR + BENTO AREA) ==================== -->
    <div class="flex-1 flex flex-col min-w-0 gap-6">

      <!-- TOPBAR FLOTANTE -->
      <header class="bg-white/65 backdrop-blur-lg rounded-4xl shadow-soft border border-white/80 px-6 py-4 flex items-center justify-between gap-4">
        
        <!-- Izquierda: Botón Hamburguesa (Móvil) + Saludo y Fecha -->
        <div class="flex items-center gap-4">
          <button
            type="button"
            (click)="uiState.toggleMobileSidebar()"
            class="lg:hidden p-2.5 rounded-2xl bg-white/80 text-purple-500 shadow-soft hover:bg-white transition-all">
            <lucide-icon [img]="icons.Menu" [strokeWidth]="iconStrokeWidth" class="w-5 h-5"></lucide-icon>
          </button>

          <div>
            <h1 class="text-lg sm:text-xl font-semibold text-slate-800 tracking-tight">
              Hola, Administradora <span class="inline-block animate-pulse">✨</span>
            </h1>
            <p class="text-xs sm:text-sm text-purple-400 font-medium">
              {{ formattedDate() }}
            </p>
          </div>
        </div>

        <!-- Derecha: Acciones Rápidas (CTA Turquesa + Notificaciones con punto Ámbar) -->
        <div class="flex items-center gap-3 sm:gap-4">
          
          <!-- Call To Action Principal (Turquesa estricto) -->
          <button
            type="button"
            routerLink="/reservar"
            class="hidden sm:inline-flex items-center gap-2 px-5 py-2.5 rounded-2xl
                   bg-teal-500 hover:bg-teal-400 active:scale-[0.98]
                   text-white text-sm font-medium shadow-teal-glow transition-all duration-200">
            <lucide-icon [img]="icons.Plus" [strokeWidth]="iconStrokeWidth" class="w-4 h-4"></lucide-icon>
            <span>Nueva Cita</span>
          </button>

          <!-- Botón de Notificaciones con punto Dorado/Ámbar -->
          <button
            type="button"
            (click)="uiState.clearNotifications()"
            aria-label="Notificaciones"
            class="relative p-3 rounded-2xl bg-white/80 hover:bg-white text-slate-600 hover:text-purple-500 shadow-soft transition-all">
            <lucide-icon [img]="icons.Bell" [strokeWidth]="iconStrokeWidth" class="w-5 h-5"></lucide-icon>

            @if (uiState.hasNotifications()) {
              <span class="absolute top-2.5 right-2.5 flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-400"></span>
              </span>
            }
          </button>
        </div>
      </header>

      <!-- ÁREA PRINCIPAL (CONTENEDOR PARA BENTO BOX) -->
      <main class="flex-1 flex flex-col">
        <router-outlet></router-outlet>
      </main>

    </div>
  </div>
</div>
