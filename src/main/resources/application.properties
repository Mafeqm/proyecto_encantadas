# Configuración de Aplicación y Servidor
server.port=8080
spring.application.name=encantadas-salon-api

# Configuración de Conexión PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/encantadas_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración JWT (JSON Web Token)
app.jwt.secret=EncantadasSalonBeautySuperSecretKeyForJWTAuth2026SecurePass
app.jwt.expiration-ms=86400000
